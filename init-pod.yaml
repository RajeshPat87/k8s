apiVersion: v1
kind: Pod
metadata:
  name: init-demo
spec:
  containers:
  - name: main-container
    image: nginx
    volumeMounts:
    - name: shared-data
      mountPath: /usr/share/nginx/html
  # This runs BEFORE the main-container
  initContainers:
  - name: init-config
    image: busybox:1.28
    command: ['sh', '-c', "echo 'Hello from the Init Container!' > /work-dir/index.html"]
    volumeMounts:
    - name: shared-data
      mountPath: /work-dir
  volumes:
  - name: shared-data
    emptyDir: {}